name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync LeetCode submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          verbose: true
          commit-header: "[LeetCode]"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate README
        run: python3 generate_readme.py

      - name: Commit README
        run: |
          git config user.name "leetcode-bot"
          git config user.email "leetcode-bot@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date"
          else
            git commit -m "Update LeetCode README"
            git push
          fi
